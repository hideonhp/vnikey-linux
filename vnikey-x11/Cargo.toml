[package]
name = "vnikey-x11"
version = "0.1.4"
edition = "2024"

[dependencies]
arboard = "3.4.1"
as-raw-xcb-connection = "1.0.1"
vnikey-core = { path = "../vnikey-core" }
vnikey-config = { path = "../vnikey-config" }
x11rb = { version = "0.13", features = ["xtest", "xkb", "allow-unsafe-code"] }
xkbcommon = { version = "0.9.0", features = ["x11"] }
vnikey-tray = { version = "0.1.4", path = "../vnikey-tray" }
ksni = { version = "0.3.6", features = ["blocking"] }
notify = "6.1"
directories = "6.0.0"
notify-rust = "4"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync"] }
zbus = "4.4"
