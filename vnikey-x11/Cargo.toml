[package]
name = "vnikey-x11"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = "3.4.1"
as-raw-xcb-connection = "1.0.1"
vnikey-core = { path = "../vnikey-core" }
x11rb = { version = "0.13", features = ["xtest", "xkb", "allow-unsafe-code"] }
xkbcommon = { version = "0.9.0", features = ["x11"] }
