name: Debug Single Test

on:
  workflow_dispatch:
    inputs:
      test_filter:
        description: 'Test name filter (leave empty to run all tests)'
        required: false
        default: ''
      package:
        description: 'Package to test'
        required: false
        default: '--workspace'
        type: choice
        options:
          - '--workspace'
          - '-p vnikey-core'
          - '-p vnikey-wayland'
          - '-p vnikey-x11'
          - '-p vnikey-ibus'
      nocapture:
        description: 'Show test output (--nocapture)'
        required: false
        default: 'true'
        type: boolean
  push:
    branches:
      - 'debug/**'

jobs:
  debug-test:
    name: Run test on Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libglib2.0-dev libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev \
            libdbus-1-dev libxtst-dev libxcb-xkb-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: |
          PKG="${{ github.event.inputs.package || '--workspace' }}"
          FILTER="${{ github.event.inputs.test_filter }}"
          NOCAP="${{ github.event.inputs.nocapture }}"

          if [ -z "$FILTER" ]; then
            echo "Running all tests for: $PKG"
            cargo test $PKG 2>&1
          else
            echo "Running test filter: '$FILTER' for: $PKG"
            NOCAP_FLAG=""
            if [ "$NOCAP" = "true" ]; then
              NOCAP_FLAG="--nocapture"
            fi
            cargo test $PKG -- "$FILTER" $NOCAP_FLAG 2>&1
          fi
        continue-on-error: true
