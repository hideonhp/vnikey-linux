name: Debug Single Test

on:
  push:
    branches:
      - debug/test-surrounding-recompose

jobs:
  debug-test:
    name: Run single test (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglib2.0-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb-shape0-dev libxcb-xfixes0-dev libdbus-1-dev libxtst-dev libxcb-xkb-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run test (no-fail-fast, show output)
        run: |
          cargo test --workspace -- "test_vni_surrounding_text_extended" --nocapture 2>&1
        continue-on-error: true
