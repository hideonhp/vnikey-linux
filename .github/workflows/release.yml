name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb-shape0-dev libxcb-xfixes0-dev libdbus-1-dev libxtst-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --workspace --release

      - name: Package artifacts
        run: |
          mkdir -p package
          cp target/release/vnikey-wayland package/
          cp target/release/vnikey-x11 package/
          cp target/release/vnikey-tray package/
          cp README.md package/
          if [ -f LICENSE ]; then
            cp LICENSE package/
          fi
          cd package
          tar -czvf ../vnikey-linux-amd64.tar.gz *
          cd ..

      - name: Publish Release
        uses: softprops/action-gh-release@v1
        with:
          files: vnikey-linux-amd64.tar.gz
