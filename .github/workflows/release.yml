name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglib2.0-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb-shape0-dev libxcb-xfixes0-dev libdbus-1-dev libxtst-dev libxcb-xkb-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --workspace --release

      - name: Package artifacts
        run: |
          mkdir -p package
          cp target/release/vnikey-wayland package/
          cp target/release/vnikey-x11 package/
          cp target/release/vnikey-gui package/
          cp vnikey.sh package/
          cp vnikey-autostart.desktop package/
          cp install.sh package/
          cp uninstall.sh package/
          cp README.md package/
          if [ -f LICENSE ]; then
            cp LICENSE package/
          fi
          cd package
          tar -czvf ../vnikey-linux-amd64.tar.gz *
          cd ..

      - name: Publish Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: ${{ github.event.inputs.version || github.ref_name }}
          files: vnikey-linux-amd64.tar.gz
