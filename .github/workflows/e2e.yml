name: E2E Integration Tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Test suite to run"
        type: choice
        required: false
        default: "all"
        options:
          - all
          - option1-xvfb-x11
          - option2-container
          - option4-wayland
          - option3-qemu-vm
      fedora_version:
        description: "Fedora version for QEMU VM (option3 only)"
        type: string
        required: false
        default: "42"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # OPTION 1: X11 với Xvfb — typing test thật
  # Matrix: gnome, kde (khác nhau ở DE package cài)
  # ============================================================
  option1-xvfb-x11:
    if: ${{ github.event.inputs.suite == 'all' || github.event.inputs.suite == 'option1-xvfb-x11' }}
    name: "E2E | Option 1 | X11 Xvfb | ${{ matrix.de }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        de: [gnome, kde]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "e2e-x11-${{ matrix.de }}"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            pkg-config libglib2.0-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libdbus-1-dev libxtst-dev libxcb-xkb-dev \
            xvfb xdotool xclip dbus-x11 at-spi2-core \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0

      - name: Install DE-specific packages
        run: |
          if [ "${{ matrix.de }}" = "gnome" ]; then
            sudo apt-get install -y gnome-terminal
          else
            sudo apt-get install -y konsole
          fi

      - name: Build vnikey-x11
        run: cargo build --release -p vnikey-x11

      - name: Run X11 E2E typing test
        run: |
          chmod +x tests/e2e/verify-x11.sh
          tests/e2e/verify-x11.sh "${{ matrix.de }}"
        timeout-minutes: 10

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-x11-${{ matrix.de }}
          path: /tmp/vnikey-e2e-*.log

  # ============================================================
  # OPTION 2: Container smoke test — binary + install verify
  # Matrix: fedora:42, fedora:44, archlinux:latest
  # ============================================================
  option2-container:
    if: ${{ github.event.inputs.suite == 'all' || github.event.inputs.suite == 'option2-container' }}
    name: "E2E | Option 2 | Container | ${{ matrix.distro }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: ["fedora:42", "fedora:44", "archlinux:latest"]
    container:
      image: ${{ matrix.distro }}
    steps:
      - name: Install build deps (Fedora)
        if: ${{ startsWith(matrix.distro, 'fedora') }}
        run: |
          dnf install -y git pkgconf glib2-devel wayland-devel \
            libxkbcommon-devel libxkbcommon-x11-devel xcb-util-wm-devel \
            dbus-devel libXtst-devel gcc file binutils

      - name: Install build deps (Arch)
        if: ${{ matrix.distro == 'archlinux:latest' }}
        run: |
          pacman -Syu --noconfirm git pkgconf glib2 libxkbcommon-x11 \
            wayland libxkbcommon xcb-util-wm dbus libxtst gcc file binutils

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "e2e-container-${{ matrix.distro }}"

      - name: Build all binaries
        run: cargo build --release --workspace

      - name: Run container smoke tests
        run: |
          chmod +x tests/e2e/verify-container.sh
          tests/e2e/verify-container.sh "${{ matrix.distro }}"

  # ============================================================
  # OPTION 4: Wayland headless — connectivity test
  # Matrix: gnome-mutter, kde-kwin
  # ============================================================
  option4-wayland:
    if: ${{ github.event.inputs.suite == 'all' || github.event.inputs.suite == 'option4-wayland' }}
    name: "E2E | Option 4 | Wayland | ${{ matrix.compositor.name }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compositor:
          - name: gnome-mutter
            pkg: mutter
            cmd: "mutter --wayland --headless --virtual-monitor 1920x1080"
          - name: kde-kwin
            pkg: kwin
            cmd: "kwin_wayland --virtual"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "e2e-wayland-${{ matrix.compositor.name }}"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            pkg-config libglib2.0-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libdbus-1-dev libxtst-dev libxcb-xkb-dev \
            ${{ matrix.compositor.pkg }} dbus-x11

      - name: Build vnikey-wayland
        run: cargo build --release -p vnikey-wayland

      - name: Run Wayland connectivity test
        run: |
          chmod +x tests/e2e/verify-wayland.sh
          tests/e2e/verify-wayland.sh \
            "${{ matrix.compositor.name }}" \
            "${{ matrix.compositor.cmd }}"
        timeout-minutes: 10

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-wayland-${{ matrix.compositor.name }}
          path: /tmp/vnikey-e2e-*.log

  # ============================================================
  # OPTION 3: QEMU VM + KVM — full typing test trong Fedora VM
  # Matrix: GNOME/KDE × Wayland/X11
  # NOTE: tốn ~30 min/job. Với 4 jobs chạy song song: 120 billing minutes/run.
  # ============================================================
  option3-qemu-vm:
    if: ${{ github.event.inputs.suite == 'all' || github.event.inputs.suite == 'option3-qemu-vm' }}
    name: "E2E | Option 3 | QEMU VM | ${{ matrix.config.name }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: "GNOME-Wayland", de: gnome, session: wayland }
          - { name: "GNOME-X11",     de: gnome, session: x11    }
          - { name: "KDE-Wayland",   de: kde,   session: wayland }
          - { name: "KDE-X11",       de: kde,   session: x11    }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Install QEMU and cloud tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            qemu-system-x86 qemu-utils cloud-image-utils genisoimage rsync

      - name: Download Fedora Cloud image
        run: |
          FEDORA_VER="${{ github.event.inputs.fedora_version || '42' }}"
          IMAGE_NAME="Fedora-Cloud-Base-Generic.x86_64-${FEDORA_VER}-1.1.qcow2"
          IMAGE_URL="https://download.fedoraproject.org/pub/fedora/linux/releases/${FEDORA_VER}/Cloud/x86_64/images/${IMAGE_NAME}"
          echo "Downloading Fedora ${FEDORA_VER} cloud image..."
          wget -q --show-progress -O fedora-cloud.qcow2 "${IMAGE_URL}"
          qemu-img resize fedora-cloud.qcow2 20G

      - name: Generate ephemeral SSH keypair
        run: |
          ssh-keygen -t ed25519 -f /tmp/vm_key -N "" -q
          echo "VM_SSH_PUB_KEY=$(cat /tmp/vm_key.pub)" >> $GITHUB_ENV

      - name: Create cloud-init seed.iso
        run: |
          chmod +x tests/e2e/create-cloud-init.sh
          tests/e2e/create-cloud-init.sh \
            "${{ matrix.config.de }}" \
            "${{ matrix.config.session }}" \
            "$VM_SSH_PUB_KEY"

      - name: Boot Fedora VM
        run: |
          qemu-system-x86_64 \
            -m 4096 \
            -smp 2 \
            -accel kvm \
            -drive file=fedora-cloud.qcow2,format=qcow2,if=virtio \
            -drive file=seed.iso,format=raw,readonly=on,if=virtio \
            -netdev user,id=net0,hostfwd=tcp::2222-:22 \
            -device virtio-net-pci,netdev=net0 \
            -serial file:/tmp/qemu-serial.log \
            -nographic \
            -daemonize
          echo "QEMU started, PID saved"

      - name: Wait for VM SSH (up to 5 minutes)
        run: |
          echo "Waiting for SSH on port 2222..."
          for i in $(seq 1 60); do
            if ssh \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=5 \
              -o BatchMode=yes \
              -i /tmp/vm_key \
              -p 2222 \
              tester@localhost "echo ssh-ready" 2>/dev/null; then
              echo "VM is ready after ${i} attempts ($(( i * 5 ))s)"
              break
            fi
            echo "Attempt ${i}/60..."
            sleep 5
          done

      - name: Copy repository to VM
        run: |
          rsync -az \
            -e "ssh -o StrictHostKeyChecking=no -i /tmp/vm_key -p 2222" \
            --exclude='.git' \
            --exclude='target' \
            ./ tester@localhost:/home/tester/vnikey-linux/

      - name: Build vnikey inside VM
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -i /tmp/vm_key \
            -p 2222 \
            tester@localhost \
            "source /home/tester/.cargo/env && \
             cd /home/tester/vnikey-linux && \
             cargo build --release 2>&1"
        timeout-minutes: 15

      - name: Run E2E test inside VM
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -i /tmp/vm_key \
            -p 2222 \
            tester@localhost \
            "source /home/tester/.cargo/env && \
             cd /home/tester/vnikey-linux && \
             chmod +x tests/e2e/verify-qemu.sh && \
             tests/e2e/verify-qemu.sh \
               '${{ matrix.config.de }}' \
               '${{ matrix.config.session }}' 2>&1"
        timeout-minutes: 15

      - name: Fetch remote logs
        if: always()
        run: |
          scp \
            -o StrictHostKeyChecking=no \
            -i /tmp/vm_key \
            -P 2222 \
            "tester@localhost:/tmp/vnikey-e2e-*.log" \
            /tmp/ || true

      - name: Upload QEMU artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-qemu-${{ matrix.config.name }}
          path: |
            /tmp/qemu-serial.log
            /tmp/vnikey-e2e-*.log