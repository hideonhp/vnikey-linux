name: Fedora Test

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on fedora:${{ matrix.container }}
    runs-on: ubuntu-latest
    container:
      image: fedora:${{ matrix.container }}
    strategy:
      matrix:
        container: [38, 39, 40]

    steps:
      - name: Install Git and Sudo (for actions checkout and commands)
        run: dnf install -y git sudo

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo dnf install -y wayland-devel libxkbcommon-devel libxkbcommon-x11-devel xcb-util-wm-devel dbus-devel libXtst-devel gcc

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Run tests
        run: cargo test --workspace
