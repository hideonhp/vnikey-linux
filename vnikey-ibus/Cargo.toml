[package]
name = "vnikey-ibus"
version = "0.2.1"
edition = "2024"

[[bin]]
name = "vnikey-ibus"
path = "src/main.rs"

[dependencies]
zbus = "4.4"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "fs"] }
vnikey-core = { path = "../vnikey-core" }
futures = "0.3"
xkbcommon = "0.9.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }


[[bench]]
name = "hotkey_bench"
harness = false

[[bench]]
name = "ibus_address_bench"
harness = false
